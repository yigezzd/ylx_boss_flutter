# Codemagic 云构建配置 - 无 Mac 环境下的 iOS 打包（免签名构建）
# 用途: 在 Codemagic 云端 macOS 机器上编译出 .ipa，Windows 下载后用 Sideloadly 安装到 iPhone 测试
#
# 使用步骤:
#   1. 注册 https://codemagic.io（免费额度每月 500 分钟，个人计划）
#   2. 将项目根目录打包成 zip（排除 build/、.dart_tool/、android/、ios/Pods 等大目录），
#      在 Codemagic 首页选择 "Upload your project" 上传
#   3. 构建完成后在 Build 页面下载 artifacts 中的 .ipa
#   4. Windows 上运行: .\build_ipa.ps1 -IpaPath <下载的ipa路径>，按提示安装到 iPhone
#
# 说明: --no-codesign 表示不签名构建（无需 Apple 开发者账号），安装时由 Sideloadly
#       用免费 Apple ID 重新签名（7 天有效期，过期重装即可）

workflows:
  ios-test-build:
    name: iOS 测试包（无签名，Sideloadly 自签安装）
    max_build_duration: 60
    environment:
      flutter: stable
      cocoapods: default
    scripts:
      - name: 安装依赖
        script: flutter pub get
      - name: 构建 iOS Release（不签名）
        script: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed 's/+/./')
          flutter build ios --release --no-codesign --dart-define=FULL_VERSION=$VERSION
      - name: 封装为 ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed 's/+/./')
          zip -r "ylx_boss_flutter_${VERSION}.ipa" Payload
          ls -lh ylx_boss_flutter_*.ipa
    artifacts:
      - ylx_boss_flutter_*.ipa
