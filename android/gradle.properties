android.useAndroidX=true
android.enableJetifier=true

# 提升编译速度配置 https://blog.csdn.net/weixin_33943347/article/details/91361727
org.gradle.daemon=true
org.gradle.configureondemand=true
# 关闭并行编译：本机内存紧张（页面文件 96% 占用），并行会拉高内存峰值导致 JVM/Dart OOM
org.gradle.parallel=false
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 开启gradle缓存
org.gradle.caching=true

# 限制 Kotlin 编译 daemon 内存，避免与 Gradle/Dart 编译竞争内存
kotlin.daemon.jvmargs=-Xmx1536m

#开启 Kotlin 内置版本（Flutter 3.44.0 要求）
android.builtInKotlin=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# JDK 路径（本机 Eclipse Adoptium JDK 17）
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot
# 禁用Kotlin增量编译（跨盘符项目避免路径异常）
kotlin.incremental=false
