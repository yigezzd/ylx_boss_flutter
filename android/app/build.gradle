plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    // 读取本目录的 agconnect-services.json，生成华为应用配置资源
    id "com.huawei.agconnect"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// versionName 保持纯版本号，不拼接 buildNumber，避免 PackageInfo 重复追加

def keystorePropertiesFile = rootProject.file("app/key.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "com.boyou.lxboss"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // 极光推送：AppKey 需与 lib/push/push_config.dart 中的 appKey 保持一致
        manifestPlaceholders = [
            JPUSH_PKGNAME : applicationId,
            JPUSH_APPKEY  : "0052165d4ce3194b134d2e58",
            JPUSH_CHANNEL : "default_developer",

            // OPPO 厂商通道
            // 注意：只要依赖了 cn.jiguang.sdk.plugin:oppo，这三个占位符就必须赋值，
            // 否则 :app:processDebugMainManifest 会因 manifest 合并缺少占位符而失败
            OPPO_APPKEY   : "OP-69ea4ed0629346cbb27475ce7df3e3cb",
            OPPO_APPID    : "OP-37744354",
            OPPO_APPSECRET: "OP-09b71178fc304bc2b680617ce5d9696f",
        ]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            // flutter build apk
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            // https://github.com/flutter/flutter/issues/47462  #48015
            // #58967 gradle 4.0.0
            shrinkResources true
            zipAlignEnabled true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.weilu.deer'
    lint {
        disable 'InvalidPackage'
    }

    // 佳博 SDK2 本地 AAR 依赖需要 flatDir 仓库
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // 佳博 SDK2 及其原生依赖（jzlib 为 jar，随 fileTree 引入）
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation(name: 'sdk2', ext: 'aar')
    implementation(name: 'serial-port', ext: 'aar')
    implementation(name: 'jzint', ext: 'aar')
    implementation(name: 'fimage', ext: 'aar')

    // 极光 OPPO 厂商通道（应用被杀进程后仍可接收推送）
    implementation 'cn.jiguang.sdk.plugin:oppo:6.2.1'
1
    // 极光华为厂商通道：与 JPush 6.2.1 保持一致，由适配库自动引入 HMS Push
    implementation 'cn.jiguang.sdk.plugin:huawei:6.2.1'
}

