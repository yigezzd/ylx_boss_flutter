name: flutter_deer
description: 灵犀管店

version: 1.0.1+108
# 唯鹿 <a05111993@163.com>
homepage: https://weilu.blog.csdn.net/

publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # 国际化本地化支持
  flutter_localizations:
    sdk: flutter
  # 去除网页URL中的"#"(hash) https://flutter.cn/docs/development/ui-navigation/url-strategies
  url_strategy: 0.3.0
  # 日期格式化 https://github.com/dart-lang/intl
  intl: ^0.20.2
  # Toast插件 https://github.com/OpenFlutter/flutter_oktoast
  oktoast: ^3.4.0
  # 网络库 https://github.com/cfug/dio
  dio: ^5.9.0
  # https://github.com/ReactiveX/rxdart
  rxdart: ^0.28.0
  # Dart 常用工具类库 https://github.com/Sky24n/common_utils
  common_utils: 2.1.0
  sp_util: 2.0.3
  # Flutter 常用工具类库 https://github.com/Sky24n/flustars
  flustars_flutter3: ^3.0.0 # flustars很久不维护，可以使用这个替代
  # Flutter 轮播图 https://github.com/mdddj/flutter_swiper_null_safety
  flutter_swiper_null_safety_flutter3: ^4.0.3 # flutter_swiper很久不维护，可以使用这个替代
  # 启动URL的插件（支持Web） https://github.com/flutter/packages/tree/main/packages/url_launcher
  url_launcher: 6.3.0
  # 图片选择插件 https://github.com/flutter/packages/tree/main/packages/image_picker
  image_picker: 1.2.0
  # 侧滑删除 https://github.com/letsar/flutter_slidable
  flutter_slidable: ^4.0.0
  # WebView插件 https://github.com/flutter/packages/tree/main/packages/webview_flutter
  webview_flutter: 4.13.0
  webview_flutter_wkwebview: 3.23.4
  # 图表库 https://github.com/imaNNeo/fl_chart
  fl_chart: ^0.70.0
  # 处理键盘事件 https://github.com/diegoveloper/flutter_keyboard_actions
  keyboard_actions: ^4.2.1
  # 城市选择列表 https://github.com/flutterchina/azlistview
  azlistview: ^2.0.0
  # 路由框架 https://github.com/theyakka/fluro
  fluro: ^2.0.5
  # 图片缓存 https://github.com/renefloor/flutter_cached_network_image
  cached_network_image: ^3.4.0
  # SVG渲染 https://github.com/dnfield/flutter_svg
  flutter_svg: ^2.0.0
  # 格式化String https://github.com/Naddiseo/dart-sprintf
  sprintf: ^7.0.0
  # 状态管理 https://github.com/rrousselGit/provider
  provider: ^6.1.2
  # 扫码 https://github.com/juliuscanute/qr_code_scanner
  qr_code_scanner:
    path: packages/qr_code_scanner
  # 振动 https://github.com/benjamindean/flutter_vibration
  vibration: 3.1.3
  vibration_web: 1.6.8
  # 获取当前设备信息 https://github.com/fluttercommunity/plus_plugins/tree/main/packages/device_info_plus
  device_info_plus: 11.5.0
  # 高德2D地图插件（支持Web） https://github.com/simplezhli/flutter_2d_amap
  flutter_2d_amap:
    git:
      ref: "2f9657e4"
      url: "https://github.com/simplezhli/flutter_2d_amap.git"
  # MD5加密 https://github.com/dart-lang/crypto
  crypto: ^3.0.6
  # 语音识别相关
  web_socket_channel: ^2.4.0
  record: ^5.0.0
  permission_handler: ^11.0.0
  # 获取App版本信息 https://github.com/fluttercommunity/plus_plugins/tree/main/packages/package_info_plus
  package_info_plus: ^8.3.0
  # 条码渲染 https://pub.dev/packages/barcode_widget
  barcode_widget: ^2.0.4
  # 二维码渲染 https://pub.dev/packages/qr_flutter
  qr_flutter: ^4.1.0
  # 可拖拽排序的 Wrap 组件 https://pub.dev/packages/reorderables
  reorderables: ^0.6.0

  # 表格增强（固定列/固定表头/横向滚动）
  data_table_2: ^2.7.2
  # 获取文件路径 https://github.com/flutter/packages/tree/main/packages/path_provider
  path_provider: ^2.1.0
  # 日志压缩打包 https://pub.dev/packages/archive
  archive: ^4.0.0

# https://github.com/simplezhli/flutter_deer/issues/187
dependency_overrides:
  scrollable_positioned_list:
    path: packages/scrollable_positioned_list
  # 修复 record_linux 0.7.2 与 record_platform_interface 接口不兼容
  record_linux: 1.3.1

dev_dependencies:
  # Widget测试
  flutter_test:
    sdk: flutter

  # 黄金测试
  #  flutter_goldens:
  #    sdk: flutter
  # 单元测试
  test: ^1.16.8

# For information on the generic Dart part of this file, see the
# following page: https:/w.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/home/
    - assets/images/store/
    - assets/images/state/
    - assets/images/order/
    - assets/images/order/dark/
    - assets/images/login/
    - assets/images/goods/
    - assets/images/shop/
    - assets/images/account/
    - assets/images/statistic/
    - assets/svg/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: RobotoThin
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
